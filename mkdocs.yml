site_name: HutameHub v3.0
site_description: Modern, instance-based, TweenService-powered UI framework for Roblox Luau.
site_url: https://hutamev2.github.io/HutameHub-Lib/
repo_url: https://github.com/hutamev2/HutameHub-Lib
repo_name: hutamev2/HutameHub-Lib

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

nav:
  - Getting Started: index.md
  - Core API:
    - Window & Initialization: window.md
    - Tabs & Sections: layout.md
  - UI Elements: elements.md
  - Core Systems: systems.md
